site_name: Student Space Programs Laboratory (SSPL)
site_description: Penn State's premier faculty-directed, student-led space research & hardware laboratory.
site_author: Student Space Programs Laboratory
site_url: https://sspl.psu.edu/   # [FILL IN: Custom domain or GitHub Pages URL]

repo_name: sspl/sspl-website      # [FILL IN: Your GitHub org/repo name]
repo_url: https://github.com/sspl/sspl-website # [FILL IN: Your GitHub repository link]

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - About SSPL:
      - Mission & Overview: about.md
      - Team & Leadership: team.md
      - Facilities & Equipment: facilities.md
  - Projects:
      - Overview: projects/index.md
      - NASA LunaRecycle Challenge: projects/lunarecycle.md
      - SMELT (Big Idea 2023): projects/smelt.md
      - Eclipse Ballooning (NEBP): projects/nebp.md
      - Flight Program & CubeSats: projects/flight-program.md
      - Past Projects: projects/past-projects.md
  - Education & Training:
      - Student Training Program (STP): stp.md
  - Join Us:
      - Get Involved: get-involved.md
      - Contact Us: contact.md
  - Community & Industry:
      - Sponsors & Donate: sponsors.md
      - News & Media: media.md
